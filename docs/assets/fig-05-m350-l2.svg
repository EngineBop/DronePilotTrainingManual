<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Matrice 350 RTK with Zenmuse L2 workflow</title><desc id="desc">Conceptual aircraft payload and survey workflow from RTK positioning and IMU through LiDAR and RGB capture to Terra processing and independent checks.</desc>
  <defs><style>.h{font:700 32px Arial;fill:#15364a}.b{font:700 20px Arial;fill:#15364a}.s{font:16px Arial;fill:#345869}.sw{font:16px Arial;fill:white}.w{font:700 19px Arial;fill:white}.l{stroke:#7896a6;stroke-width:5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7896a6"/></marker></defs>
  <rect width="1200" height="650" fill="#f5f9fa"/><text x="55" y="58" class="h">Matrice 350 RTK + Zenmuse L2 — capture chain</text>
  <g transform="translate(70 125)"><rect width="250" height="145" rx="18" fill="#164e63"/><text x="30" y="42" class="w">RTK positioning</text><text x="30" y="76" class="sw">Network RTK or approved</text><text x="30" y="101" class="sw">base-station workflow;</text><text x="30" y="126" class="sw">record datum and status.</text></g><path d="M320 198H410" class="l"/>
  <g transform="translate(415 105)"><path d="M175 0l62 72h-124z" fill="#2563a6"/><rect x="75" y="70" width="200" height="20" rx="10" fill="#15364a"/><path d="M100 80H20M250 80h80M115 82L70 122M235 82l45 40" stroke="#15364a" stroke-width="9"/><rect x="138" y="90" width="74" height="78" rx="14" fill="#b85c1e"/><circle cx="175" cy="130" r="17" fill="#f8d49d"/><text x="82" y="205" class="b">M350 RTK + L2</text><text x="72" y="232" class="s">LiDAR + RGB + IMU data</text></g><path d="M745 198H835" class="l"/>
  <g transform="translate(840 125)"><rect width="285" height="145" rx="18" fill="#0f766e"/><text x="30" y="42" class="w">Mission execution</text><text x="30" y="76" class="sw">Terrain, speed, overlap,</text><text x="30" y="101" class="sw">scan pattern and turns set</text><text x="30" y="126" class="sw">for the required product.</text></g><path d="M982 270V350" class="l"/>
  <g transform="translate(805 355)"><rect width="320" height="125" rx="18" fill="#2563a6"/><text x="30" y="42" class="w">DJI Terra processing</text><text x="30" y="75" class="sw">Controlled template, trajectory,</text><text x="30" y="100" class="sw">point cloud, RGB and report.</text></g><path d="M805 418H690" class="l"/>
  <g transform="translate(370 355)"><rect width="315" height="125" rx="18" fill="white" stroke="#b85c1e" stroke-width="3"/><text x="28" y="42" class="b">Independent verification</text><text x="28" y="75" class="s">GCP/checkpoints, strip checks,</text><text x="28" y="100" class="s">coverage and accuracy statement.</text></g>
  <rect x="70" y="530" width="1055" height="70" rx="13" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="98" y="560" class="b">Published DJI accuracy figures are conditional, not a project guarantee.</text><text x="98" y="585" class="s">Acceptance is based on the project specification and independent checks in the actual site conditions.</text>
</svg>
