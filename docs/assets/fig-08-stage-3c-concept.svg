<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Stage 3C construction survey control layout</title><desc id="desc">A clearly conceptual oblique site plan showing river, stopbank construction corridor, six permanent ground control points, three independent checkpoints, launch area, workers and no-fly buffers.</desc>
