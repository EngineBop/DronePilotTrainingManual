<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Proposed permanent ground control target</title><desc id="desc">Top and section views of a small high-contrast 3D-printed target marked BOPRC Survey Control Do Not Move, staked to prepared ground with surveyed centre.</desc>
  <defs><style>.h{font:700 32px Arial;fill:#15364a}.b{font:700 20px Arial;fill:#15364a}.s{font:16px Arial;fill:#315568}.l{stroke:#7896a6;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="620" fill="#f5f9fa"/><text x="55" y="58" class="h">Proposed permanent GCP target — prototype for field testing</text>
  <g transform="translate(100 120)"><circle cx="200" cy="200" r="170" fill="white" stroke="#15364a" stroke-width="8"/><path d="M200 30A170 170 0 0 1 370 200H200Z" fill="#15364a"/><path d="M200 370A170 170 0 0 1 30 200H200Z" fill="#15364a"/><circle cx="200" cy="200" r="12" fill="#b85c1e" stroke="white" stroke-width="4"/><circle cx="200" cy="45" r="7" fill="#b85c1e"/><circle cx="355" cy="200" r="7" fill="#b85c1e"/><circle cx="200" cy="355" r="7" fill="#b85c1e"/><circle cx="45" cy="200" r="7" fill="#b85c1e"/></g>
  <text x="108" y="510" class="b">BOPRC SURVEY CONTROL — DO NOT MOVE</text><text x="168" y="540" class="s">High-contrast centre; four stake holes; UV-stable prototype material.</text>
  <g transform="translate(610 125)"><rect x="0" y="150" width="480" height="28" rx="8" fill="#15364a"/><path d="M55 160V350M425 160V350" stroke="#b85c1e" stroke-width="12"/><path d="M40 350h30l-15 80zM410 350h30l-15 80z" fill="#b85c1e"/><path d="M0 178h480v180H0z" fill="#b9a27d" opacity=".55"/><path d="M0 178c95-35 160 18 240-5s155-32 240 5" class="l"/><circle cx="240" cy="145" r="12" fill="#b85c1e"/><path d="M240 110V75" class="l"/><text x="168" y="58" class="b">surveyed centre</text><text x="18" y="470" class="s">Prepared firm surface; topsoil/vegetation cleared.</text><text x="18" y="496" class="s">Stake flush and remove trip/plant hazards.</text></g>
  <rect x="610" y="520" width="500" height="58" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="635" y="545" class="s">Final size is chosen from planned GSD and visibility tests,</text><text x="635" y="568" class="s">not from this drawing. Record target ID, condition and coordinates.</text>
</svg>
