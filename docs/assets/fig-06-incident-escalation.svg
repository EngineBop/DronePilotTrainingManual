<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Drone incident response and escalation</title><desc id="desc">Response starts with people and airspace safety, then site control, preservation, internal notification, external notification and learning.</desc>
  <defs><style>.h{font:700 32px Arial;fill:#15364a}.n{font:700 22px Arial;fill:white}.s{font:16px Arial;fill:white}.d{font:16px Arial;fill:#315568}.l{stroke:#7896a6;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7896a6"/></marker></defs>
  <rect width="1200" height="680" fill="#f5f9fa"/><text x="55" y="58" class="h">Incident response — sequence and routing</text>
  <g transform="translate(55 105)"><rect width="300" height="115" rx="16" fill="#b54708"/><text x="24" y="38" class="n">1  Make safe</text><text x="24" y="70" class="s">People, aircraft, traffic, fire,</text><text x="24" y="94" class="s">battery and environmental risk.</text></g><path d="M355 162H445" class="l"/>
  <g transform="translate(450 105)"><rect width="300" height="115" rx="16" fill="#164e63"/><text x="24" y="38" class="n">2  Control the site</text><text x="24" y="70" class="s">Stop flying; establish exclusion;</text><text x="24" y="94" class="s">coordinate recovery.</text></g><path d="M750 162H840" class="l"/>
  <g transform="translate(845 105)"><rect width="300" height="115" rx="16" fill="#0f766e"/><text x="24" y="38" class="n">3  Preserve evidence</text><text x="24" y="70" class="s">Flight logs, photos, controller,</text><text x="24" y="94" class="s">parts and witness details.</text></g><path d="M995 220V290" class="l"/>
  <g transform="translate(845 295)"><rect width="300" height="125" rx="16" fill="#2563a6"/><text x="24" y="38" class="n">4  Internal escalation</text><text x="24" y="70" class="s">Manager / H&amp;S; Property for</text><text x="24" y="94" class="s">asset loss + Vault; technical</text><text x="24" y="116" class="s">team for suspected malfunction.</text></g><path d="M840 357H750" class="l"/>
  <g transform="translate(450 295)"><rect width="300" height="125" rx="16" fill="#2563a6"/><text x="24" y="38" class="n">5  External routing</text><text x="24" y="70" class="s">Emergency services, CAA, ATC/</text><text x="24" y="94" class="s">aerodrome, landowner or other</text><text x="24" y="116" class="s">agency as the event requires.</text></g><path d="M445 357H355" class="l"/>
  <g transform="translate(55 295)"><rect width="300" height="125" rx="16" fill="#0f766e"/><text x="24" y="38" class="n">6  Record + learn</text><text x="24" y="70" class="s">Vault record, occurrence report,</text><text x="24" y="94" class="s">investigation, corrective actions</text><text x="24" y="116" class="s">and return-to-service approval.</text></g>
  <rect x="55" y="500" width="1090" height="112" rx="16" fill="white" stroke="#b85c1e" stroke-width="3"/><text x="85" y="535" class="d">A lost aircraft is not automatically retrieved. Assess water, traffic, height, access, electrical and landowner risks first.</text><text x="85" y="568" class="d">Do not enter water, climb trees, enter private land or expose staff to machinery solely to recover equipment.</text><text x="85" y="598" class="d">The exact routing varies by event; the PIC makes the initial record and the responsible manager confirms notifications.</text>
</svg>
