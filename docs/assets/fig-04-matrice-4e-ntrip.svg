<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Matrice 4E network RTK workflow</title><desc id="desc">Conceptual data flow from satellites and LINZ PositioNZ NTRIP corrections through internet and controller to the Matrice 4E, with ground control and checkpoints.</desc>
  <defs><style>.h{font:700 32px Arial;fill:#15364a}.b{font:700 20px Arial;fill:#15364a}.bw{font:700 20px Arial;fill:white}.s{font:16px Arial;fill:#345869}.sw{font:16px Arial;fill:white}.l{stroke:#0f766e;stroke-width:5;fill:none;marker-end:url(#m)}.d{stroke:#b85c1e;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#o)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0f766e"/></marker><marker id="o" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#b85c1e"/></marker></defs>
  <rect width="1200" height="650" fill="#f5f9fa"/><text x="55" y="58" class="h">Matrice 4E — network RTK (NTRIP) concept</text>
  <circle cx="150" cy="150" r="62" fill="#dceff2" stroke="#164e63" stroke-width="3"/><text x="104" y="146" class="b">GNSS</text><text x="87" y="172" class="s">satellites</text>
  <rect x="330" y="90" width="265" height="120" rx="18" fill="#164e63"/><text x="360" y="132" class="bw">LINZ PositioNZ</text><text x="360" y="163" class="sw">NTRIP corrections</text><text x="360" y="188" class="sw">NZGD2000</text>
  <path d="M215 150H325" class="l"/><path d="M595 150H735" class="l"/><rect x="740" y="90" width="220" height="120" rx="18" fill="#0f766e"/><text x="775" y="132" class="bw">Internet + RC</text><text x="775" y="163" class="sw">credentials, mountpoint,</text><text x="775" y="188" class="sw">correction status</text><path d="M850 210V310" class="l"/>
  <g transform="translate(690 315)"><path d="M160 0l55 65h-110z" fill="#2563a6"/><rect x="75" y="62" width="170" height="18" rx="9" fill="#15364a"/><path d="M95 72H20M225 72h75M108 72L65 110M212 72l43 38" stroke="#15364a" stroke-width="8"/><circle cx="160" cy="72" r="15" fill="#b85c1e"/><text x="92" y="150" class="b">Matrice 4E</text><text x="48" y="177" class="s">images + RTK positions</text></g>
  <rect x="80" y="375" width="420" height="135" rx="18" fill="white" stroke="#b85c1e" stroke-width="3"/><text x="110" y="415" class="b">Survey control remains independent</text><text x="110" y="448" class="s">Surveyed GCPs constrain and verify the model.</text><text x="110" y="477" class="s">Checkpoints test accuracy without adjustment.</text><path d="M500 445H680" class="d"/>
  <rect x="80" y="550" width="1040" height="55" rx="12" fill="#e6f2f4"/><text x="105" y="584" class="s">Before capture: confirm RTK FIX, coordinate reference, correction age, antenna environment and a fallback if mobile data fails.</text>
</svg>
