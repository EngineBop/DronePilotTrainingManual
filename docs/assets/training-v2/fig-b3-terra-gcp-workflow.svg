<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DJI Terra control and checkpoint workflow</title>
  <desc id="desc">An eight-stage workflow from creating the project and checking coordinate systems through marking points, optimising, reconstructing and accepting outputs.</desc>
  <defs><style>.h{font:700 34px Arial;fill:#15364a}.k{font:700 20px Arial;fill:white}.t{font:17px Arial;fill:white}.q{font:700 18px Arial;fill:#b54708}.s{font:18px Arial;fill:#234b5f}.a{stroke:#7b98a7;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7b98a7"/></marker></defs>
  <rect width="1200" height="720" fill="#f5f9fa"/>
  <text x="60" y="62" class="h">DJI Terra — control, check and accept</text>
  <text x="60" y="96" class="s">Follow the same order each time. Stop when coordinates, point roles or residuals do not make sense.</text>

  <g transform="translate(55 145)"><rect width="245" height="135" rx="18" fill="#164e63"/><text x="20" y="40" class="k">1  Create project</text><text x="20" y="75" class="t">Use the working copy</text><text x="20" y="102" class="t">and record the version.</text></g>
  <path d="M305 212H350" class="a"/>
  <g transform="translate(355 145)"><rect width="245" height="135" rx="18" fill="#0f766e"/><text x="20" y="40" class="k">2  Import + inspect</text><text x="20" y="75" class="t">Images/POS present;</text><text x="20" y="102" class="t">coverage looks complete.</text></g>
  <path d="M605 212H650" class="a"/>
  <g transform="translate(655 145)"><rect width="245" height="135" rx="18" fill="#2563a6"/><text x="20" y="40" class="k">3  Set coordinates</text><text x="20" y="75" class="t">Confirm horizontal,</text><text x="20" y="102" class="t">vertical and units.</text></g>
  <path d="M905 212H950" class="a"/>
  <g transform="translate(955 145)"><rect width="190" height="135" rx="18" fill="#b85c1e"/><text x="18" y="40" class="k">4  Import points</text><text x="18" y="75" class="t">Set each as GCP</text><text x="18" y="102" class="t">or checkpoint.</text></g>
  <path d="M1050 285V350" class="a"/>

  <g transform="translate(955 355)"><rect width="190" height="135" rx="18" fill="#b85c1e"/><text x="18" y="40" class="k">5  Mark points</text><text x="18" y="75" class="t">Exact centre in</text><text x="18" y="102" class="t">clear images.</text></g>
  <path d="M950 422H905" class="a"/>
  <g transform="translate(655 355)"><rect width="245" height="135" rx="18" fill="#2563a6"/><text x="20" y="40" class="k">6  Optimise</text><text x="20" y="75" class="t">Run the adjustment;</text><text x="20" y="102" class="t">investigate outliers.</text></g>
  <path d="M650 422H605" class="a"/>
  <g transform="translate(355 355)"><rect width="245" height="135" rx="18" fill="#0f766e"/><text x="20" y="40" class="k">7  Reconstruct</text><text x="20" y="75" class="t">Create required outputs</text><text x="20" y="102" class="t">without changing the test.</text></g>
  <path d="M350 422H305" class="a"/>
  <g transform="translate(55 355)"><rect width="245" height="135" rx="18" fill="#164e63"/><text x="20" y="40" class="k">8  Check + accept</text><text x="20" y="75" class="t">Coverage, checkpoints,</text><text x="20" y="102" class="t">report and limitations.</text></g>

  <rect x="55" y="550" width="1090" height="105" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="85" y="592" class="q">Do not accept a result because it “looks right” or because the GCP residuals are small.</text>
  <text x="85" y="626" class="s">The independent checkpoints, coverage, coordinate system and project tolerance must all support the intended use.</text>
</svg>
