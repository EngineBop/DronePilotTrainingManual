<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">From aircraft to protected project data</title>
  <desc id="desc">A five-stage workflow from checking files at the field site to verified deliverables and retained source data.</desc>
  <defs>
    <style>
      .h{font:700 34px Arial;fill:#15364a}.k{font:700 20px Arial;fill:#15364a}.t{font:17px Arial;fill:#234b5f}.w{font:700 20px Arial;fill:white}.wt{font:17px Arial;fill:white}.n{font:700 18px Arial;fill:#0f766e}.q{font:700 18px Arial;fill:#b54708}.a{stroke:#7b98a7;stroke-width:4;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7b98a7"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#f5f9fa"/>
  <text x="60" y="62" class="h">From aircraft to protected project data</text>
  <text x="60" y="94" class="t">Check first, copy safely, keep the source untouched, then process a working copy.</text>

  <g transform="translate(50 145)"><rect width="190" height="155" rx="18" fill="#164e63"/><text x="20" y="38" class="w">1  Field check</text><text x="20" y="74" class="wt">Files present</text><text x="20" y="100" class="wt">Coverage complete</text><text x="20" y="126" class="wt">No obvious corruption</text></g>
  <path d="M245 222H275" class="a"/>
  <g transform="translate(280 145)"><rect width="190" height="155" rx="18" fill="#0f766e"/><text x="20" y="38" class="w">2  Primary copy</text><text x="20" y="74" class="wt">Approved project</text><text x="20" y="100" class="wt">folder and clear</text><text x="20" y="126" class="wt">mission name</text></g>
  <path d="M475 222H505" class="a"/>
  <g transform="translate(510 145)"><rect width="190" height="155" rx="18" fill="#2563a6"/><text x="20" y="38" class="w">3  Verify + back up</text><text x="20" y="74" class="wt">Check file counts</text><text x="20" y="100" class="wt">Open sample files</text><text x="20" y="126" class="wt">Create second copy</text></g>
  <path d="M705 222H735" class="a"/>
  <g transform="translate(740 145)"><rect width="190" height="155" rx="18" fill="#b85c1e"/><text x="20" y="38" class="w">4  Working copy</text><text x="20" y="74" class="wt">Terra project</text><text x="20" y="100" class="wt">Control + checks</text><text x="20" y="126" class="wt">Processing record</text></g>
  <path d="M935 222H965" class="a"/>
  <g transform="translate(970 145)"><rect width="180" height="155" rx="18" fill="#164e63"/><text x="18" y="38" style="font:700 18px Arial;fill:white">5  Check + release</text><text x="18" y="74" class="wt">QA result</text><text x="18" y="100" class="wt">Limitations</text><text x="18" y="126" class="wt">Deliverables</text></g>

  <rect x="60" y="355" width="1080" height="105" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="90" y="398" class="q">Do not format or reuse the source card yet.</text>
  <text x="90" y="432" class="t">Keep it unchanged until the primary copy and backup have both been checked and the field data is confirmed complete.</text>
</svg>
