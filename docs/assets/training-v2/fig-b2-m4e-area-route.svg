<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Matrice 4E area route setup in DJI Pilot 2</title>
  <desc id="desc">Six practical steps to create and verify an orthophoto area route using the Matrice 4E wide camera.</desc>
  <defs><style>.h{font:700 34px Arial;fill:#15364a}.s{font:18px Arial;fill:#234b5f}.k{font:700 20px Arial;fill:white}.t{font:17px Arial;fill:white}.q{font:700 18px Arial;fill:#b54708}.a{stroke:#7b98a7;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7b98a7"/></marker></defs>
  <rect width="1200" height="690" fill="#f5f9fa"/>
  <text x="60" y="62" class="h">Matrice 4E — Area Route in DJI Pilot 2</text>
  <text x="60" y="96" class="s">Use the wide mapping camera, build the boundary, set the route, then verify it before upload.</text>

  <g transform="translate(55 145)"><rect width="300" height="130" rx="18" fill="#164e63"/><text x="22" y="39" class="k">1  Create Area Route</text><text x="22" y="76" class="t">Flight Route → Create Route</text><text x="22" y="103" class="t">→ Area Route</text></g>
  <path d="M360 210H440" class="a"/>
  <g transform="translate(445 145)"><rect width="300" height="130" rx="18" fill="#0f766e"/><text x="22" y="39" class="k">2  Select the system</text><text x="22" y="76" class="t">Matrice 4E · Wide 20 MP</text><text x="22" y="103" class="t">Ortho Collection</text></g>
  <path d="M750 210H830" class="a"/>
  <g transform="translate(835 145)"><rect width="310" height="130" rx="18" fill="#2563a6"/><text x="22" y="39" class="k">3  Draw the work area</text><text x="22" y="76" class="t">Follow the authorised boundary;</text><text x="22" y="103" class="t">include the required edge margin.</text></g>
  <path d="M990 280V345" class="a"/>

  <g transform="translate(835 350)"><rect width="310" height="130" rx="18" fill="#2563a6"/><text x="22" y="39" class="k">4  Set the route</text><text x="22" y="76" class="t">Height, speed, overlap, course,</text><text x="22" y="103" class="t">gimbal and completion action.</text></g>
  <path d="M830 415H750" class="a"/>
  <g transform="translate(445 350)"><rect width="300" height="130" rx="18" fill="#0f766e"/><text x="22" y="39" class="k">5  Confirm camera + RTK</text><text x="22" y="76" class="t">Exposure, focus, storage,</text><text x="22" y="103" class="t">home point and RTK FIX.</text></g>
  <path d="M440 415H360" class="a"/>
  <g transform="translate(55 350)"><rect width="300" height="130" rx="18" fill="#164e63"/><text x="22" y="39" class="k">6  Review then upload</text><text x="22" y="76" class="t">Preview terrain and obstacles;</text><text x="22" y="103" class="t">save, upload and low-hover test.</text></g>

  <rect x="55" y="535" width="1090" height="100" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="85" y="576" class="q">The table values are starting points, not fixed settings for every site.</text>
  <text x="85" y="609" class="s">Adjust for required GSD, terrain, obstacles, light, wind and the project's agreed accuracy.</text>
</svg>
