<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual pre and post surface comparison and cut fill result</title>
  <desc id="desc">Four panels show a pre-stripping surface, post-stripping surface, signed elevation difference and ArcGIS Cut Fill result, followed by a cross-section and indicative volume table.</desc>
  <defs><linearGradient id="elev" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#27627d"/><stop offset=".5" stop-color="#72aa73"/><stop offset="1" stop-color="#d4b461"/></linearGradient><style>.h{font:700 31px Arial;fill:#15364a}.s{font:17px Arial;fill:#36596b}.k{font:700 18px Arial;fill:#15364a}.t{font:14px Arial;fill:#36596b}.w{font:700 14px Arial;fill:white}</style></defs>
  <rect width="1200" height="820" fill="#f5f9fa"/><text x="48" y="54" class="h">Before + after → checked surface change</text><text x="48" y="85" class="s">Conceptual stopbank-stripping example. Use the same datum, grid, boundary, classification and checked workflow.</text>
  <g transform="translate(45 120)"><rect width="260" height="275" rx="16" fill="white" stroke="#c3d4dc" stroke-width="2"/><text x="18" y="36" class="k">1  Pre-stripping DEM</text><rect x="18" y="56" width="224" height="165" rx="10" fill="url(#elev)"/><path d="M28 194 C71 143 111 170 148 123 C182 82 206 103 234 73" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="12"/><text x="18" y="250" class="t">Baseline surface</text></g>
  <g transform="translate(325 120)"><rect width="260" height="275" rx="16" fill="white" stroke="#c3d4dc" stroke-width="2"/><text x="18" y="36" class="k">2  Post-stripping DEM</text><rect x="18" y="56" width="224" height="165" rx="10" fill="url(#elev)"/><path d="M28 194 C71 154 111 178 148 140 C182 103 206 114 234 89" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="12"/><text x="18" y="250" class="t">Checked repeat surface</text></g>
  <g transform="translate(605 120)"><rect width="260" height="275" rx="16" fill="white" stroke="#c3d4dc" stroke-width="2"/><text x="18" y="36" class="k">3  Post − Pre difference</text><rect x="18" y="56" width="224" height="165" rx="10" fill="#e8eceb"/><path d="M26 192 C75 151 114 174 150 137 C184 102 210 114 238 86" fill="none" stroke="#d45a3a" stroke-width="38"/><path d="M28 196 C77 174 112 193 148 164 C181 138 206 146 235 121" fill="none" stroke="#2b78a6" stroke-width="17"/><text x="18" y="244" class="t">+ higher   − lower</text><text x="18" y="264" class="t">Grey = no reliable change.</text></g>
  <g transform="translate(885 120)"><rect width="270" height="275" rx="16" fill="white" stroke="#c3d4dc" stroke-width="2"/><text x="18" y="36" class="k">4  ArcGIS Cut Fill</text><rect x="18" y="56" width="234" height="165" rx="10" fill="#e8eceb"/><path d="M28 192 C77 151 116 174 152 137 C186 102 212 114 242 86" fill="none" stroke="#f07943" stroke-width="39"/><path d="M31 197 C79 174 115 194 150 165 C184 138 210 147 239 122" fill="none" stroke="#3c88b4" stroke-width="17"/><rect x="32" y="68" width="63" height="22" rx="5" fill="#f07943"/><text x="46" y="84" class="w">CUT +</text><rect x="106" y="68" width="63" height="22" rx="5" fill="#3c88b4"/><text x="119" y="84" class="w">FILL −</text><text x="18" y="244" class="t">State the Esri sign convention</text><text x="18" y="264" class="t">on every result.</text></g>
  <g transform="translate(45 425)"><rect width="710" height="280" rx="18" fill="white" stroke="#c3d4dc" stroke-width="2"/><text x="24" y="42" class="k">Cross-section: volume comes from cell area × height change</text><line x1="60" y1="224" x2="650" y2="224" stroke="#9bb0ba" stroke-width="2"/><path d="M60 170 C160 115 240 142 332 97 C422 54 530 102 650 77" fill="none" stroke="#164e63" stroke-width="5"/><path d="M60 190 C160 152 240 168 332 132 C422 97 530 130 650 108" fill="none" stroke="#f07943" stroke-width="5"/><path d="M60 170 C160 115 240 142 332 97 C422 54 530 102 650 77 L650 108 C530 130 422 97 332 132 C240 168 160 152 60 190Z" fill="#f6c7b3" opacity=".75"/><text x="565" y="67" class="t">pre</text><text x="565" y="132" class="t">post</text><line x1="595" y1="63" x2="642" y2="63" stroke="#164e63" stroke-width="4"/><line x1="595" y1="128" x2="642" y2="128" stroke="#f07943" stroke-width="4"/><text x="76" y="255" class="t">Validate each surface, then check unchanged ground for systematic offset.</text></g>
  <g transform="translate(785 425)"><rect width="370" height="280" rx="18" fill="#164e63"/><text x="24" y="42" style="font:700 19px Arial;fill:white">Report together</text><g style="font:15px Arial;fill:white"><text x="24" y="79">Gross cut</text><text x="240" y="79">[ m³ ]</text><text x="24" y="112">Gross fill</text><text x="240" y="112">[ m³ ]</text><text x="24" y="145">Net volume</text><text x="240" y="145">[ m³ ]</text><text x="24" y="178">Compared area</text><text x="240" y="178">[ m² ]</text><text x="24" y="211">Pre / post RMSEz</text><text x="240" y="211">[ m ]</text></g><rect x="20" y="229" width="330" height="34" rx="8" fill="#e3f5ee"/><text x="37" y="252" style="font:700 14px Arial;fill:#087f5b">Below threshold = no reliable change</text></g>
  <text x="55" y="760" class="s">A clear-looking map is not an accuracy statement. Retain checkpoints, masks, stable-area comparison and the acceptance record.</text>
</svg>
