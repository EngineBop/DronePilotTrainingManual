<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ArcGIS Pro elevation processing workflow</title>
  <desc id="desc">A five-stage workflow from protected source point cloud to checked elevation products.</desc>
  <defs>
    <style>.h{font:700 34px Arial;fill:#15364a}.s{font:18px Arial;fill:#234b5f}.k{font:700 19px Arial;fill:#15364a}.t{font:16px Arial;fill:#234b5f}.w{font:700 19px Arial;fill:white}.q{font:700 18px Arial;fill:#087f5b}.a{stroke:#7b98a7;stroke-width:4;fill:none;marker-end:url(#m)}</style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7b98a7"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#f5f9fa"/>
  <text x="60" y="64" class="h">Point cloud to checked elevation products</text>
  <text x="60" y="98" class="s">Keep the source, choose the correct surface, and check it before deriving contours or volumes.</text>

  <rect x="55" y="175" width="190" height="155" rx="18" fill="#164e63"/>
  <text x="82" y="218" class="w">1  Source</text>
  <text x="82" y="254" style="font:16px Arial;fill:white">LAS / LAZ</text>
  <text x="82" y="282" style="font:16px Arial;fill:white">CRS + height record</text>
  <text x="82" y="310" style="font:16px Arial;fill:white">Protected original</text>
  <path d="M252 252H306" class="a"/>

  <rect x="310" y="175" width="190" height="155" rx="18" fill="white" stroke="#bfd1d9" stroke-width="3"/>
  <text x="335" y="218" class="k">2  Inspect</text>
  <text x="335" y="254" class="t">Extent and density</text>
  <text x="335" y="282" class="t">Classes and gaps</text>
  <text x="335" y="310" class="t">Survey boundary</text>
  <path d="M507 252H561" class="a"/>

  <rect x="565" y="175" width="190" height="155" rx="18" fill="#0f8277"/>
  <text x="590" y="218" class="w">3  Build surface</text>
  <text x="590" y="254" style="font:16px Arial;fill:white">Ground → DEM</text>
  <text x="590" y="282" style="font:16px Arial;fill:white">First surface → DSM</text>
  <text x="590" y="310" style="font:16px Arial;fill:white">Cell size by purpose</text>
  <path d="M762 252H816" class="a"/>

  <rect x="820" y="175" width="190" height="155" rx="18" fill="white" stroke="#bfd1d9" stroke-width="3"/>
  <text x="845" y="218" class="k">4  Check surface</text>
  <text x="845" y="254" class="t">Hillshade and edges</text>
  <text x="845" y="282" class="t">Water, spikes, voids</text>
  <text x="845" y="310" class="t">Known levels</text>
  <path d="M1017 252H1060" class="a"/>

  <circle cx="1095" cy="252" r="62" fill="#2b6cb0"/>
  <text x="1084" y="242" style="font:700 20px Arial;fill:white">5</text>
  <text x="1059" y="270" style="font:700 16px Arial;fill:white">Derive</text>
  <text x="1054" y="356" class="k">Contours</text>
  <text x="1027" y="385" class="t">Change + volumes</text>

  <rect x="170" y="430" width="860" height="72" rx="14" fill="#e1f4ea"/>
  <text x="250" y="474" class="q">A finer raster is not automatically a more accurate surface.</text>
</svg>
