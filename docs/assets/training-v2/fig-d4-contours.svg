<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual workflow from checked bare-earth DEM to contours</title>
  <desc id="desc">A hillshaded elevation surface is converted into labelled contour lines using a compact set of ArcGIS Pro contour parameters.</desc>
  <defs><linearGradient id="dem" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#185d79"/><stop offset=".45" stop-color="#55a57b"/><stop offset=".72" stop-color="#c5bd69"/><stop offset="1" stop-color="#e9a15d"/></linearGradient><style>.h{font:700 31px Arial;fill:#15364a}.s{font:17px Arial;fill:#36596b}.k{font:700 19px Arial;fill:#15364a}.t{font:15px Arial;fill:#36596b}.a{stroke:#7897a5;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7897a5"/></marker></defs>
  <rect width="1200" height="610" fill="#f5f9fa"/><text x="50" y="55" class="h">Checked DEM to useful contours</text><text x="50" y="87" class="s">Conceptual example — select the interval for the job and map scale, not simply the smallest value available.</text>
  <g transform="translate(50 125)"><rect width="420" height="365" rx="18" fill="white" stroke="#c2d4dc" stroke-width="2"/><text x="25" y="42" class="k">1  Bare-earth DEM + hillshade</text><rect x="25" y="67" width="370" height="250" rx="12" fill="url(#dem)"/><path d="M45 290 C100 238 150 275 205 220 C260 165 310 208 378 120" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="13"/><text x="25" y="345" class="t">Check water, voids, spikes, edges and known levels first.</text></g>
  <path d="M485 305H550" class="a"/>
  <g transform="translate(565 125)"><rect width="420" height="365" rx="18" fill="white" stroke="#c2d4dc" stroke-width="2"/><text x="25" y="42" class="k">2  Derived contour lines</text><rect x="25" y="67" width="370" height="250" rx="12" fill="#eef4e7"/>
    <g fill="none" stroke="#556b60"><path d="M42 278 C88 225 145 244 188 203 C239 154 303 178 378 103" stroke-width="2"/><path d="M40 303 C92 253 151 272 204 228 C253 186 318 204 385 136" stroke-width="2"/><path d="M52 245 C102 194 153 215 181 174 C223 115 299 144 359 81" stroke-width="2"/><path d="M74 217 C120 178 145 186 168 151 C198 104 264 115 322 78" stroke-width="2"/><path d="M105 190 C145 162 152 146 174 119 C205 84 251 94 286 77" stroke-width="4"/></g>
    <g style="font:700 13px Arial;fill:#36596b"><text x="80" y="286">12.0</text><text x="122" y="235">12.5</text><text x="165" y="190">13.0</text><text x="210" y="145">13.5</text><text x="250" y="104">14.0</text></g><text x="25" y="345" class="t">Inspect noisy loops before smoothing or CAD handover.</text></g>
  <g transform="translate(1015 135)"><rect width="145" height="340" rx="16" fill="#164e63"/><text x="18" y="40" style="font:700 17px Arial;fill:white">Contour tool</text><g style="font:14px Arial;fill:white"><text x="18" y="82">Input</text><text x="18" y="105">checked DEM</text><text x="18" y="148">Interval</text><text x="18" y="171">0.5 m / 1 m+</text><text x="18" y="214">Base</text><text x="18" y="237">project datum</text><text x="18" y="280">Output</text><text x="18" y="303">GDB feature</text></g></g>
  <rect x="160" y="530" width="880" height="48" rx="12" fill="#e3f5ee"/><text x="267" y="561" style="font:700 17px Arial;fill:#087f5b">Contours improve interpretation; they do not improve the source surface accuracy.</text>
</svg>
