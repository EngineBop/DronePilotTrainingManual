<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Ferntech service and return-to-use workflow</title><desc id="desc">Workflow from service trigger through backup and booking, assessment and quote, authorised work, receipt checks and record updates.</desc>
  <defs><style>.h{font:700 32px Arial;fill:#15364a}.b{font:700 18px Arial;fill:white}.s{font:15px Arial;fill:white}.k{font:16px Arial;fill:#315568}.l{stroke:#7896a6;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7896a6"/></marker></defs>
  <rect width="1200" height="600" fill="#f5f9fa"/><text x="55" y="58" class="h">Service, repair and return to operation</text>
  <g transform="translate(55 120)"><rect width="185" height="125" rx="16" fill="#164e63"/><text x="20" y="36" class="b">1  Trigger</text><text x="20" y="67" class="s">Scheduled service,</text><text x="20" y="91" class="s">fault, impact or</text><text x="20" y="115" class="s">battery concern.</text></g><path d="M240 183H265" class="l"/>
  <g transform="translate(270 120)"><rect width="185" height="125" rx="16" fill="#2563a6"/><text x="20" y="36" class="b">2  Prepare</text><text x="20" y="67" class="s">Quarantine; back up</text><text x="20" y="91" class="s">logs/data; list kit</text><text x="20" y="115" class="s">and symptoms.</text></g><path d="M455 183H480" class="l"/>
  <g transform="translate(485 120)"><rect width="185" height="125" rx="16" fill="#0f766e"/><text x="20" y="36" class="b">3  Book</text><text x="20" y="67" class="s">Ferntech service</text><text x="20" y="91" class="s">request; obtain</text><text x="20" y="115" class="s">packing instructions.</text></g><path d="M670 183H695" class="l"/>
  <g transform="translate(700 120)"><rect width="185" height="125" rx="16" fill="#b85c1e"/><text x="20" y="36" class="b">4  Approve</text><text x="20" y="67" class="s">Assessment, quote,</text><text x="20" y="91" class="s">parts and scope under</text><text x="20" y="115" class="s">BOPRC authority.</text></g><path d="M885 183H910" class="l"/>
  <g transform="translate(915 120)"><rect width="230" height="125" rx="16" fill="#0f766e"/><text x="20" y="36" class="b">5  Receive + release</text><text x="20" y="67" class="s">Certificate, firmware,</text><text x="20" y="91" class="s">configuration, batteries and</text><text x="20" y="115" class="s">controlled function flight.</text></g>
  <rect x="55" y="310" width="1090" height="125" rx="16" fill="white" stroke="#164e63" stroke-width="3"/><text x="85" y="350" class="k">Vendor guidance: Ferntech recommends an annual health check including cleaning, inspection, firmware, calibration, battery health and a test flight.</text><text x="85" y="385" class="k">Proposed BOPRC policy: schedule six-monthly servicing, with annual service as the minimum backstop — both require formal approval and budget.</text><text x="85" y="420" class="k">After every service or repair: Property updates the private equipment register; the custodian retains the certificate and maintenance record.</text>
  <text x="55" y="520" class="k">Unscheduled triggers override the calendar: impact, water or dust ingress, abnormal vibration, link/RTK faults, damage, swelling batteries, or manufacturer notices.</text>
</svg>
